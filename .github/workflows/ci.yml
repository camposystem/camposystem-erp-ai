
name: CI

on:
  push:
    branches:
      - main
      - develop
      - feature/**
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
          POSTGRES_DB: camposystem_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d camposystem_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CAMPOSYSTEM_TEST_CONNECTION: "Host=localhost;Port=5432;Database=camposystem_test;Username=postgres;Password=postgres123"
      ConnectionStrings__PostgreSQL: "Host=localhost;Port=5432;Database=camposystem_test;Username=postgres;Password=postgres123"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.4

      - name: Add .NET tools to PATH
        run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: EF Info
        run: dotnet ef --version

      - name: Apply Identity migrations
        run: >
          dotnet ef database update
          --context IdentityDbContext
          --project src/CampoSystem.ErpAI.Infrastructure
          --startup-project src/CampoSystem.ErpAI.Api
          --configuration Release
          --no-build

      - name: Apply Products migrations
        run: >
          dotnet ef database update
          --context ProductDbContext
          --project src/CampoSystem.ErpAI.Infrastructure
          --startup-project src/CampoSystem.ErpAI.Api
          --configuration Release
          --no-build

      - name: Test
        run: dotnet test --no-build --configuration Release
